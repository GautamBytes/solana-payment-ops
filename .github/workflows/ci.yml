name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: payops_test
          POSTGRES_PASSWORD: payops
          POSTGRES_USER: payops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payops -d payops_test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://payops:payops@127.0.0.1:5432/payops_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.15.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm schemas:check
      - run: pnpm conformance fixtures/v0.1/manifest.json
      - run: pnpm audit --prod
      - run: node scripts/verify-public-packages.mjs
