name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-release
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: payops_test
          POSTGRES_PASSWORD: payops
          POSTGRES_USER: payops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payops -d payops_test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      CI: "true"
      DATABASE_URL: postgres://payops:payops@127.0.0.1:5432/payops_test
      GITHUB_REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm release:verify
      - run: node scripts/verify-release-tag.mjs "${GITHUB_REF_NAME}"
      - run: node scripts/build-release-evidence.mjs "${GITHUB_REF_NAME}" release/evidence
      - run: node scripts/publish-release.mjs "${GITHUB_REF_NAME}"
      - run: >-
          gh release create "${GITHUB_REF_NAME}"
          release/evidence/*
          --verify-tag
          --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
